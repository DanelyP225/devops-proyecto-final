<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps App Demo - Pipeline CI/CD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { color: #333; font-size: 20px; }
    input { width: 70%; padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { background: #e9ecef; margin: 5px 0; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Pipeline DevOps Demo</h1>
    <p>Gestión de Tareas / Items</p>
    <input type="text" id="itemName" placeholder="Escribe un nuevo item...">
    <button onclick="addItem()">Agregar</button>
    <ul id="itemList"></ul>
  </div>

  <script>
    async function fetchItems() {
      const res = await fetch('/api/items');
      const data = await res.json();
      const list = document.getElementById('itemList');
      list.innerHTML = data.map(item => `<li>${item.name}</li>`).join('');
    }

    async function addItem() {
      const input = document.getElementById('itemName');
      const name = input.value.trim();
      if (!name) return;

      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });

      input.value = '';
      fetchItems();
    }

    fetchItems();
  </script>
</body>
</html>
