<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Portal - CRUD Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1e293b; width: 100%; max-width: 600px; border-radius: 16px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); border: 1px solid #334155; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    .title-area h1 { font-size: 1.3rem; font-weight: 700; color: #f8fafc; }
    .title-area p { font-size: 0.85rem; color: #94a3b8; margin-top: 2px; }
    .badge-status { display: inline-flex; align-items: center; gap: 6px; background: rgba(34, 197, 94, 0.1); color: #4ade80; padding: 6px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .pulse { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
    .input-group { display: flex; gap: 10px; margin-bottom: 24px; }
    input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    button:hover { background: #0369a1; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-header h2 { font-size: 0.9rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.05em; }
    .count-badge { background: #334155; color: #38bdf8; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
    li { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-info { display: flex; flex-direction: column; gap: 2px; }
    .item-id { font-size: 0.75rem; color: #64748b; font-weight: 600; }
    .actions { display: flex; gap: 8px; }
    .btn-edit { background: #eab308; color: #000; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
    .btn-edit:hover { background: #ca8a04; }
    .btn-delete { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
    .btn-delete:hover { background: #dc2626; }
    .empty-state { text-align: center; padding: 24px; color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-area">
        <h1>DevOps Final Danely</h1>
        <p>Gestión de Registros & CI/CD Pipeline</p>
      </div>
      <div class="badge-status">
        <span class="pulse"></span>
        <span id="statusText">ONLINE</span>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="itemName" placeholder="Nombre del nuevo elemento...">
      <button id="btnAdd">Agregar</button>
    </div>

    <div class="section-header">
      <h2>Registros en Base de Datos</h2>
      <span class="count-badge" id="itemCount">0</span>
    </div>

    <ul id="itemList">
      <div class="empty-state">No hay registros almacenados.</div>
    </ul>
  </div>

  <script>
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        document.getElementById('statusText').innerText = res.ok ? 'ONLINE' : 'DEGRADED';
      } catch (err) {
        document.getElementById('statusText').innerText = 'OFFLINE';
      }
    }

    async function fetchItems() {
      try {
        const res = await fetch('/api/items');
        const data = await res.json();
        const list = document.getElementById('itemList');
        document.getElementById('itemCount').innerText = data.length;

        if (!data || data.length === 0) {
          list.innerHTML = '<div class="empty-state">No hay registros almacenados.</div>';
          return;
        }

        let htmlContent = '';
        data.forEach(function(item) {
          htmlContent += '<li>' +
            '<div class="item-info">' +
              '<span class="item-id">ID: #' + item.id + '</span>' +
              '<strong>' + item.name + '</strong>' +
            '</div>' +
            '<div class="actions">' +
              '<button class="btn-edit" onclick="editItem(' + item.id + ', \'' + encodeURIComponent(item.name) + '\')">Editar</button>' +
              '<button class="btn-delete" onclick="deleteItem(' + item.id + ')">Eliminar</button>' +
            '</div>' +
          '</li>';
        });

        list.innerHTML = htmlContent;
      } catch (err) {
        console.error('Error al obtener registros:', err);
      }
    }

    async function addItem() {
      const input = document.getElementById('itemName');
      const name = input.value.trim();
      if (!name) return;

      try {
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name })
        });
        if (res.ok) {
          input.value = '';
        }
      } catch (err) {
        console.error('Error al agregar:', err);
      }
      fetchItems();
    }

    async function editItem(id, encodedName) {
      const currentName = decodeURIComponent(encodedName);
      const newName = prompt('Actualizar nombre:', currentName);
      if (!newName || newName.trim() === '' || newName.trim() === currentName) return;

      try {
        await fetch('/api/items/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName.trim() })
        });
      } catch (err) {
        console.error('Error al editar:', err);
      }
      fetchItems();
    }

    async function deleteItem(id) {
      if (!confirm('¿Deseas eliminar este registro?')) return;

      try {
        await fetch('/api/items/' + id, {
          method: 'DELETE'
        });
      } catch (err) {
        console.error('Error al eliminar:', err);
      }
      fetchItems();
    }

    document.getElementById('btnAdd').addEventListener('click', addItem);
    document.getElementById('itemName').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addItem();
      }
    });

    checkHealth();
    fetchItems();
  </script>
</body>
</html>
